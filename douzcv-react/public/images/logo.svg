<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 70" fill="none" role="img" aria-label="douzCv Logo Dv">
  <defs>
    <linearGradient id="coralDvGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7A6E" />
      <stop offset="100%" stop-color="#FF6154" />
    </linearGradient>
    <filter id="dvGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#FF6154" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- ── 1. MONOGRAMME GÉOMÉTRIQUE : LETTRE 'D' (FEUILLE CV) + LETTRE 'v' (CHECKMARK) ── -->
  <g transform="translate(6, 6)">
    <!-- Forme de la lettre D formant la feuille de CV avec coin plié -->
    <path 
      d="M12 4 H32 L44 16 V32 C44 46 34 54 12 54 H12 V4 Z" 
      stroke="#0B1320" 
      stroke-width="5" 
      stroke-linejoin="round"
      fill="none"
    />
    <!-- Pli du coin supérieur de la feuille -->
    <path 
      d="M32 4 V16 H44" 
      stroke="#0B1320" 
      stroke-width="4.5" 
      stroke-linejoin="round"
      fill="none"
    />
    <!-- Lettre 'v' sous forme de Checkmark dynamique qui traverse le D -->
    <path 
      d="M18 28 L28 44 L54 10" 
      stroke="url(#coralDvGrad)" 
      stroke-width="6" 
      stroke-linecap="round" 
      stroke-linejoin="round"
      filter="url(#dvGlow)"
    />
  </g>

  <!-- ── 2. WORDMARK TYPOGRAPHIQUE DOUZCV ── -->
  <text 
    x="74" 
    y="46" 
    font-family="'Outfit', 'Plus Jakarta Sans', -apple-system, sans-serif" 
    font-size="34" 
    font-weight="900" 
    letter-spacing="-0.04em"
  >
    <tspan fill="#0B1320">douz</tspan><tspan fill="#FF6154">Cv</tspan>
  </text>
</svg>
